<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移除照片 EXIF</title>
  <meta name="description" content="查看並清除照片裡的 GPS 位置、相機型號與拍攝時間，畫質完全不變。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23171717'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='5' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='5' y='13' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    .summary { margin-top: var(--s-lg); }
    .row { align-items: start; }
    .row .thumb { width: 56px; height: 56px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: var(--r-pill); background: var(--canvas-soft-2); color: var(--body); white-space: nowrap; }
    .tag.is-gps { background: var(--warning-soft); color: var(--warning-deep); font-weight: 500; }
    .tag.is-clean { background: transparent; color: var(--mute); padding: 0; }
    .tag.is-done { background: transparent; color: var(--success); padding: 0; font-weight: 500; }
    .row .r-state { align-self: center; }
    a.inline { color: var(--link); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="back" href="../../"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5"/><rect class="cell" x="5" y="5" width="6" height="6" rx="1.5"/><rect class="cell" x="13" y="5" width="6" height="6" rx="1.5"/><rect class="cell" x="5" y="13" width="6" height="6" rx="1.5"/><rect class="cell" x="13" y="13" width="6" height="6" rx="1.5"/></svg>工具集</a>
      <span class="sep" aria-hidden="true">/</span>
      <span class="here">移除照片 EXIF</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="h">
        <h1 id="h">分享照片前，先清掉隱藏資訊</h1>
        <p>照片可能藏著拍攝地點的 GPS 座標、手機型號與時間。這裡會列出找到的資訊，並以無損方式移除，畫質完全不變。</p>
      </section>

      <label class="drop" id="drop" for="file-input" tabindex="0">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></span>
        <strong>拖曳照片到這裡，或點擊選擇</strong>
        <small>JPG、PNG、WebP，可多張</small>
        <input id="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" aria-label="選擇照片">
      </label>

      <div class="summary" id="summary" hidden>
        <div class="stats">
          <div class="stat"><div class="k">照片</div><div class="v" id="st-count">0</div></div>
          <div class="stat"><div class="k">含 GPS 位置</div><div class="v" id="st-gps">0</div></div>
          <div class="stat"><div class="k">含其他資訊</div><div class="v" id="st-meta">0</div></div>
        </div>
      </div>

      <div class="actions" id="actions" hidden>
        <button type="button" class="btn btn-primary" id="btn-start" disabled>移除全部資訊</button>
        <button type="button" class="btn" id="btn-change">重新選擇</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="btn-zip" hidden>全部下載（ZIP）</button>
      </div>

      <div class="note note-error" id="note-error" role="alert" hidden></div>

      <section id="progress" hidden>
        <div class="status"><span class="label" id="status-label"></span><span class="pct" id="status-pct"></span></div>
        <div class="bar" id="bar"><i></i></div>
      </section>

      <ol class="rows" id="rows" hidden></ol>
      <div class="note note-info" id="note-orient" hidden>為了讓照片維持正確方向，有轉向資訊的照片只會保留「方向」這一項，其他資訊全部移除。</div>
    </main>

    <footer class="foot">建議使用電腦版 Chrome、Edge 或 Firefox</footer>
  </div>

  <script src="../../assets/kit.js"></script>
  <script src="strip.js"></script>
  <script src="app.js"></script>
</body>
</html>
